<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f3ff">
  <meta name="description" content="Math Site being updated — be back in a sec. Rocky and Luna will see you soon!">
  <title>Math Site being updated | Rocky &amp; Luna</title>
  <style>
    :root { color-scheme: light; --ink:#252344; --muted:#65617d; --purple:#6651ad; --paper:#f6f3ff; --yellow:#ffdc80; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; }
    body { background:var(--paper); color:var(--ink); font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif; }
    .page { position:relative; isolation:isolate; width:100%; height:100svh; display:grid; grid-template-rows:auto 1fr auto; padding:clamp(20px,4vw,52px); overflow:hidden; }
    .page::before { content:""; position:absolute; z-index:-2; width:min(74vw,1080px); height:min(74vw,1080px); top:49%; left:50%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(ellipse, #fffdf5 22%, #fdf9f1 45%, transparent 71%); }
    header { display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:800; font-size:20px; letter-spacing:-.5px; }
    .brand-icon { width:38px; height:38px; background:var(--ink); color:#fff; border-radius:12px; display:grid; grid-template-columns:1fr 1fr; place-items:center; padding:6px; font:700 14px/1 Arial,sans-serif; transform:rotate(-7deg); }
    .header-note { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .header-note::before { content:""; width:7px; height:7px; border-radius:50%; background:#a18bc9; }
    main { min-height:0; width:100%; max-width:1400px; margin:auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(380px,1.6fr) minmax(0,1fr); align-items:center; gap:0; position:relative; }
    .message { text-align:center; z-index:2; padding:24px 0 40px; }
    .badge { display:inline-flex; align-items:center; gap:9px; border:1px solid #e0d4b4; border-radius:100px; background:#fff4d3; color:#766036; padding:10px 16px; font-size:11px; line-height:1; font-weight:800; letter-spacing:.15em; text-transform:uppercase; }
    .badge svg { flex-shrink:0; }
    h1 { margin:25px -35px 0; font-size:clamp(44px,5.4vw,83px); line-height:1.06; letter-spacing:-.055em; font-weight:900; }
    h1 span { display:block; }
    h1 .accent { color:var(--purple); position:relative; display:inline-block; }
    h1 .accent::after { content:""; position:absolute; z-index:-1; left:-2%; right:-2%; bottom:3%; height:14%; background:var(--yellow); transform:rotate(-2deg); border-radius:50%; }
    .return { margin:25px 0 0; font-size:clamp(22px,2.35vw,35px); line-height:1.2; font-weight:700; letter-spacing:-.035em; }
    .waiting { display:flex; justify-content:center; align-items:center; gap:6px; margin-top:25px; height:14px; }
    .waiting i { width:7px; height:7px; border-radius:50%; background:#a397bd; animation:twinkle 2s ease-in-out infinite; }
    .waiting i:nth-child(2) { animation-delay:.25s; }
    .waiting i:nth-child(3) { animation-delay:.5s; }
    figure { margin:0; min-width:0; display:flex; align-items:center; flex-direction:column; position:relative; z-index:1; }
    figure::before { content:""; position:absolute; width:90%; aspect-ratio:1; background:#e9e1fb; border-radius:50%; top:12%; z-index:-1; }
    figure.luna::before { background:#ffe9cf; }
    .portrait { width:115%; max-width:390px; height:min(47vh,480px); object-fit:contain; filter:drop-shadow(0 18px 16px #33225612); animation:float 6s ease-in-out infinite; }
    .rocky .portrait { transform:rotate(-7deg); --tilt:-7deg; }
    .luna .portrait { transform:rotate(7deg); --tilt:7deg; animation-delay:-3s; }
    figcaption { margin-top:17px; padding:7px 17px; color:#62537d; background:#e9e1f6; border-radius:30px; font-size:15px; font-weight:800; letter-spacing:.015em; transform:rotate(-5deg); }
    .luna figcaption { background:#ffe6c5; color:#8a6040; transform:rotate(5deg); }
    .symbol { position:absolute; z-index:-1; color:#c2b1dc; user-select:none; font-weight:700; line-height:1; }
    .plus { top:14%; left:17%; font-size:35px; transform:rotate(-15deg); }
    .times { bottom:12%; right:17%; font-size:37px; color:#d3b579; transform:rotate(12deg); }
    .equals { top:8%; right:11%; font-size:28px; transform:rotate(-12deg); color:#bfaecf; }
    .star { width:20px; height:20px; fill:#c3b3da; position:absolute; z-index:-1; }
    .star.one { bottom:19%; left:6%; width:16px; }
    .star.two { top:33%; right:2%; fill:#dfbc70; }
    .star.three { top:10%; left:37%; width:13px; fill:#d5bf8c; }
    footer { display:flex; justify-content:center; align-items:center; gap:9px; color:var(--muted); font-size:13px; line-height:1.4; text-align:center; }
    footer svg { color:#a997c1; flex:none; }
    @keyframes float { 0%,100% { transform:translateY(0) rotate(var(--tilt)); } 50% { transform:translateY(-12px) rotate(var(--tilt)); } }
    @keyframes twinkle { 0%,75%,100% { opacity:.35; transform:translateY(0); } 35% { opacity:1; transform:translateY(-3px); } }
    @media (max-width:900px) {
      .page { padding:24px; }
      main { grid-template-columns:1fr 1.7fr 1fr; }
      .portrait { width:125%; height:min(39vh,360px); }
      h1 { font-size:clamp(40px,6.6vw,59px); margin-inline:-30px; }
      .message { padding-bottom:25px; }
      .badge { font-size:9px; padding:9px 12px; letter-spacing:.11em; }
      .return { font-size:25px; }
      .header-note { font-size:10px; }
    }
    @media (max-width:640px) and (min-height:501px) {
      .page { padding:20px 20px 18px; }
      .brand { font-size:17px; gap:9px; }
      .brand-icon { width:33px; height:33px; border-radius:10px; }
      .header-note { font-size:9px; letter-spacing:.06em; }
      main { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:auto minmax(0,1fr); align-self:stretch; height:100%; align-items:center; column-gap:15px; padding-top:clamp(14px,3vh,32px); padding-bottom:12px; }
      .message { grid-column:1/-1; grid-row:1; padding:0 0 6px; }
      .badge { font-size:9px; padding:8px 12px; }
      h1 { margin:17px 0 0; font-size:clamp(38px,9.2vw,59px); line-height:1.03; }
      .return { font-size:clamp(23px,5.5vw,30px); margin-top:17px; }
      .waiting { margin-top:15px; height:10px; }
      figure { grid-row:2; align-self:center; min-height:0; }
      .rocky { grid-column:1; }
      .luna { grid-column:2; }
      .portrait { width:108%; height:min(32svh,300px); max-width:235px; }
      figcaption { font-size:12px; margin-top:8px; padding:5px 13px; }
      footer { font-size:11px; }
      .plus { top:9%; left:1%; font-size:23px; }
      .equals { top:47%; right:0; font-size:22px; }
      .times { bottom:8%; right:48%; font-size:26px; }
      .star.one { bottom:10%; left:1%; }
      .star.two { top:51%; right:47%; width:13px; }
      .star.three { top:40%; left:9%; }
    }
    @media (max-height:600px) and (min-width:641px), (max-height:500px) {
      .page { padding:16px 28px; }
      .brand { font-size:17px; }
      .brand-icon { width:30px; height:30px; padding:5px; border-radius:9px; font-size:11px; }
      main { grid-template-columns:1fr 1.7fr 1fr; }
      .message { padding:10px 0; }
      h1 { font-size:clamp(32px,5.4vw,60px); margin-top:15px; }
      .return { font-size:23px; margin-top:16px; }
      .waiting { margin-top:15px; }
      .portrait { height:49svh; width:112%; }
      figcaption { margin-top:7px; font-size:12px; padding:5px 12px; }
      .badge { font-size:9px; padding:7px 11px; }
      footer { font-size:11px; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; } }
    @media print {
      @page { size:landscape; margin:12mm; }
      html,body { height:100%; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      .page { height:175mm; padding:5mm; break-inside:avoid; }
      main { grid-template-columns:1fr 1.6fr 1fr; }
      .portrait { height:95mm; }
      h1 { font-size:48pt; }
      .return { font-size:24pt; }
      * { animation:none!important; }
    }
  </style>
</head>
